<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Remember me App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

</head>
<body>
    <main class="auth-container">

    <!-- Shared feedback area for both forms -->
    <div id="message" class="message hidden"></div>

    <!-- LOGIN VIEW -->
    <section id="loginView">
      <h1>Log in</h1>
      <form id="loginForm">
        <label for="loginUsername">Username</label>
        <input id="loginUsername" name="username" type="text" autocomplete="username" required />

        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />

        <label class="checkbox">
          <input id="rememberMe" type="checkbox" />
          Remember me on this device
        </label>

        <button type="submit">Log in</button>
      </form>

      <p class="switch">
        No account?
        <a href="#" id="showSignup">Create one</a>
      </p>
    </section>

    <!-- SIGNUP VIEW -->
    <section id="signupView" class="hidden">
      <h1>Create account</h1>
      <form id="signupForm">
        <label for="signupUsername">Username</label>
        <input id="signupUsername" name="username" type="text" autocomplete="username" required />

        <label for="signupPassword">Password</label>
        <input id="signupPassword" name="password" type="password" autocomplete="new-password" required />

        <button type="submit">Create account</button>
      </form>

      <p class="switch">
        Already have an account?
        <a href="#" id="showLogin">Log in</a>
      </p>
    </section>

  </main>

  <script src="{{ url_for('static', filename='app.js') }}" defer> </script>
    
</body>
</html>
